services:
  # ─── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: adaptive_lang_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-adaptive_lang_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-adaptive_lang_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adaptive_net

  # ─── Redis Cache & Rate Limiter ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adaptive_lang_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adaptive_net

  # ─── Backend Express REST API ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: adaptive_lang_api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-adaptive_lang_dev}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_12345678901234567890123456}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adaptive_net

  # ─── Frontend React Web App (Nginx) ──────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: adaptive_lang_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - adaptive_net

volumes:
  postgres_data:
    name: adaptive_lang_postgres_data
  redis_data:
    name: adaptive_lang_redis_data

networks:
  adaptive_net:
    name: adaptive_lang_network
    driver: bridge
